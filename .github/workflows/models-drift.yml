name: models-drift

# New AWS operations appear in botocore every week. This job regenerates the sensitive-output list from
# the latest botocore and fails when it would change, so a new secret-returning operation is reviewed
# instead of passing as read-only. A failure means: bump tools/genops/requirements.txt, run make generate,
# review the new operations in tools/genops/reviewed.json, and commit
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Unpinned on purpose: the point is to see what the newest models add
      - name: Install latest botocore
        run: python -m pip install botocore

      - name: Check list against latest models
        run: go run ./tools/genops -models "$(python -c 'import botocore, os; print(os.path.dirname(botocore.__file__))')/data" -check
